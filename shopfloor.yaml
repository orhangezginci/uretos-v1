    networks:
      - default
    restart: unless-stopped

  shopfloor-initializer:
    image: python:3.11-slim
    container_name: uretos-shopfloor-initializer
    volumes:
      - ./shopfloor.yaml:/app/shopfloor.yaml
      - ./scripts/register_full_shopfloor.py:/app/register_full_shopfloor.py
    working_dir: /app
    environment:
      - GATEWAY_URL=http://gateway-api:8080
      - YAML_FILE=shopfloor.yaml
    depends_on:
      - gateway-api
    command:
      - sh
      - -c
      - |
        python3 -c "
        import time, urllib.request
        print('Warte auf Gateway-API (/healthz)...')
        while True:
            try:
                if urllib.request.urlopen('http://gateway-api:8080/healthz', timeout=2).status == 200:
                    print('Gateway ist erreichbar!')
                    break
            except Exception:
                pass
            time.sleep(2)
        "
        echo "Installiere requests..."
        pip install --no-cache-dir requests --quiet
        python3 register_full_shopfloor.py
    networks:
      - default
      - tenant-net