networks:
  default:
  tenant-net:

services:
  connector-box-01:
    build: ./services/connector-box-poller
    container_name: uretos-connector-box-01
    environment:
      - GATEWAY_URL=http://gateway-api:8080
      - BOX_HARDWARE_ID=sim-box-01
      - POLL_INTERVAL_SECONDS=5
    networks:
      - default
      - tenant-net
    restart: unless-stopped
    depends_on:
      shopfloor-initializer:
        condition: service_completed_successfully
  connector-box-02:
    build: ./services/connector-box-poller
    container_name: uretos-connector-box-02
    environment:
      - GATEWAY_URL=http://gateway-api:8080
      - BOX_HARDWARE_ID=sim-box-02
      - POLL_INTERVAL_SECONDS=5
    networks:
      - default
      - tenant-net
    restart: unless-stopped
    depends_on:
      shopfloor-initializer:
        condition: service_completed_successfully
        
  # --- OPC-UA MASCHINEN-SIMULATOREN ---
  machine-lathe-01:
    build: ./tools/opc-machine-sim
    container_name: uretos-machine-lathe-01
    environment:
      - MACHINE_NAME=CNC-LATHE-01
      - MANUFACTURER=DMG Mori
      - MODEL=NLX 2500
      - SERIAL=SN-DMG-01
      - PORT=4840
    ports:
      - "4840:4840"
    networks:
      - default
    restart: unless-stopped

  machine-lathe-02:
