version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: uretos-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI, dev only
    volumes:
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-defaults.conf:ro
    environment:
      RABBITMQ_LOAD_DEFINITIONS: "true"
      RABBITMQ_DEFINITIONS_FILE: /etc/rabbitmq/definitions.json
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: uretos-docker-proxy
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      POST: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
    restart: unless-stopped

  tenant-provisioning-service:
    build: ./services/tenant-provisioning-service
    container_name: uretos-tenant-provisioning-service
    depends_on:
      rabbitmq:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    environment:
      RABBITMQ_URL: "amqp://uretos:uretos_dev_pass@rabbitmq:5672/"
    restart: unless-stopped

networks:
  default:
    name: uretos-core-net